name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:public
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:release
      - run: go -C launcher test -race ./...
